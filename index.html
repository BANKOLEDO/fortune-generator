<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fortune Message Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Momo+Trust+Display&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  </head>

  <body
    class="font-['Momo Trust Display'] min-h-screen px-3 xl:px-4 bg-cover bg-center bg-no-repeat text-gray-800 flex flex-col items-center overflow-y-auto relative"
    style="background-image: url('assets/hero-bg.jpg')"
  >
    <!-- Background SVGs -->
     <!-- Decorative floating SVGs -->
    <div class="absolute inset-0 -z-10 pointer-events-none opacity-20">
      <svg
        class="w-12 h-12 absolute top-10 left-20 text-gray-800 float"
        fill="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          d="M12 17.27L18.18 21 16.54 13.97 22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"
        />
      </svg>

      <svg
        class="w-14 h-14 absolute top-1/4 right-20 text-gray-700 float-slow"
        fill="currentColor"
        viewBox="0 0 24 24"
      >
        <path d="M12.76 3a9 9 0 1010.24 10.24A9 9 0 0112.76 3z" />
      </svg>

      <svg
        class="w-10 h-10 absolute bottom-16 left-24 text-gray-700 float-delay"
        fill="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          d="M2 12l8.5-2.5L12 2l1.5 7.5L22 12l-8.5 2.5L12 22l-1.5-7.5z"
        />
      </svg>

      <svg
        class="w-10 h-10 absolute bottom-32 right-16 text-gray-800 float"
        fill="currentColor"
        viewBox="0 0 24 24"
      >
        <path d="M12 2l2 7 7 2-7 2-2 7-2-7-7-2 7-2z" />
      </svg>

      <svg
        class="w-8 h-8 absolute top-1/3 left-10 text-gray-700 float-slow"
        fill="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          d="M12 2l1.5 5 5 1.5-5 1.5L12 15l-1.5-5-5-1.5 5-1.5z"
        />
      </svg>

      <svg
        class="w-16 h-16 absolute bottom-10 right-10 text-gray-800 float-delay"
        fill="currentColor"
        viewBox="0 0 24 24"
      >
        <circle cx="12" cy="12" r="8" />
      </svg>
    </div>

    <!-- Hero -->
    <header class="text-center mt-20 md:mt-28 px-4 max-w-2xl z-10">
      <h1 class="text-4xl md:text-6xl font-bold text-gray-900 leading-tight mb-4">
        Get Your Daily Fortune & Personalized Insight
      </h1>
      <p class="text-gray-600 text-lg md:text-xl mb-8">
        Tell us how you feel and what you aim for today — receive a message that
        inspires your next move.
      </p>
      <button
        class="px-6 py-3 bg-amber-500 text-white font-semibold rounded-full shadow-md hover:shadow-lg hover:-translate-y-0.5 transition"
      >
        Try Fortune Free
      </button>
    </header>

    <!-- Main Card -->
    <main
      class="mt-20 bg-white/90 backdrop-blur-md shadow-2xl rounded-3xl w-full max-w-3xl p-8 relative z-10"
    >
      <!-- Input Section -->
      <section id="inputSection">
        <h2 class="text-2xl md:text-3xl font-semibold text-center mb-10">
          Tell Me About Yourself
        </h2>

        <div class="space-y-8">
          <!-- Name -->
          <div>
            <label class="block text-base font-medium mb-3">Your Name</label>
            <input
              id="userName"
              type="text"
              placeholder="Enter your name"
              class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-amber-500 transition"
            />
          </div>

          <!-- Mood -->
          <div>
            <label class="block text-base font-medium mb-3">Current Mood</label>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
              <button class="mood-btn border-2 border-gray-200 rounded-xl py-3 flex flex-col items-center gap-2 bg-white hover:border-yellow-400 transition" data-mood="happy" data-color="yellow">
                <i class="fas fa-smile text-xl text-yellow-500"></i><span>Happy</span>
              </button>

              <button class="mood-btn border-2 border-gray-200 rounded-xl py-3 flex flex-col items-center gap-2 bg-white hover:border-red-400 transition" data-mood="motivated" data-color="red">
                <i class="fas fa-fire text-xl text-red-500"></i><span>Motivated</span>
              </button>

              <button class="mood-btn border-2 border-gray-200 rounded-xl py-3 flex flex-col items-center gap-2 bg-white hover:border-purple-400 transition" data-mood="creative" data-color="purple">
                <i class="fas fa-paint-brush text-xl text-purple-500"></i><span>Creative</span>
              </button>

              <button class="mood-btn border-2 border-gray-200 rounded-xl py-3 flex flex-col items-center gap-2 bg-white hover:border-emerald-400 transition" data-mood="relaxed" data-color="emerald">
                <i class="fas fa-couch text-xl text-emerald-500"></i><span>Relaxed</span>
              </button>

              <button class="mood-btn border-2 border-gray-200 rounded-xl py-3 flex flex-col items-center gap-2 bg-white hover:border-orange-400 transition" data-mood="adventurous" data-color="orange">
                <i class="fas fa-mountain text-xl text-orange-500"></i><span>Adventurous</span>
              </button>

              <button class="mood-btn border-2 border-gray-200 rounded-xl py-3 flex flex-col items-center gap-2 bg-white hover:border-blue-400 transition" data-mood="focused" data-color="blue">
                <i class="fas fa-bullseye text-xl text-blue-500"></i><span>Focused</span>
              </button>

              <button class="mood-btn border-2 border-gray-200 rounded-xl py-3 flex flex-col items-center gap-2 bg-white hover:border-pink-400 transition" data-mood="curious" data-color="pink">
                <i class="fas fa-search text-xl text-pink-500"></i><span>Curious</span>
              </button>

              <button class="mood-btn border-2 border-gray-200 rounded-xl py-3 flex flex-col items-center gap-2 bg-white hover:border-lime-400 transition" data-mood="chill" data-color="lime">
                <i class="fas fa-umbrella-beach text-xl text-lime-500"></i><span>Chill</span>
              </button>
            </div>
          </div>

          <!-- Goal -->
          <div>
            <label class="block text-base font-medium mb-3">Today's Goal</label>
            <select
              id="userGoal"
              class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-amber-500 transition"
            >
              <option value="" disabled selected>Select your main goal today</option>
              <option value="productivity">Boost Productivity</option>
              <option value="learning">Learn Something New</option>
              <option value="creativity">Be More Creative</option>
              <option value="health">Improve Health</option>
              <option value="relationships">Strengthen Relationships</option>
              <option value="mindfulness">Practice Mindfulness</option>
              <option value="growth">Personal Growth</option>
            </select>
          </div>
        </div>

        <div class="flex justify-center mt-10">
          <button id="generateBtn" class="bg-amber-500 hover:bg-amber-600 text-white font-medium rounded-xl px-6 py-3 flex items-center gap-2 transition">
            <i class="fas fa-cookie-bite text-lg"></i> Generate My Fortune
          </button>
        </div>
      </section>

      <!-- Result Section -->
      <section id="resultSection" class="hidden text-center">
        <div class="mb-8">
          <div class="text-5xl mb-4 text-amber-500">
            <i class="fas fa-cookie-bite animate-bounce"></i>
          </div>
          <h2 class="text-2xl font-semibold mb-3 text-gray-800">
            Your Personalized Fortune
          </h2>
          <p id="userGreeting" class="text-gray-600 mb-4"></p>

          <div id="fortuneMessage" class="bg-amber-50 border-l-4 border-amber-500 p-4 rounded-xl text-lg font-medium text-gray-800 mb-4"></div>
          <div id="fortuneAdvice" class="text-gray-700"></div>
        </div>

        <div class="flex flex-col sm:flex-row gap-4 justify-center">
          <button id="newFortuneBtn" class="border-2 border-amber-500 text-amber-600 px-5 py-2 rounded-xl hover:bg-amber-500 hover:text-white transition flex items-center gap-2">
            <i class="fas fa-cookie"></i> Get New Fortune
          </button>
        </div>
      </section>
    </main>

    <footer class="text-center text-gray-600 text-sm mt-16 mb-6 z-10">
      Developed by <span class="text-amber-600 font-semibold"><a href="https://devolabanks.vercel.app" target="_blank">Dev Olabanks</a></span>
    </footer>

    <style>
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-20px); }
      }
      .animate-float { animation: float 6s ease-in-out infinite; }
      .animate-float-slow { animation: float 10s ease-in-out infinite; }
      .animate-bounce-slow { animation: bounce 3s infinite; }
      .animate-spin-slow { animation: spin 12s linear infinite; }
    </style>

    <script src="script.js"></script>
  </body>
</html>
